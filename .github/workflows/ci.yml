name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_unit:
    name: Lint & Unit / Integration (no SQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install ruff black mypy pytest

      - name: Lint
        run: make lint

      - name: Run tests (no SQL)
        run: make test

  sql_tests:
    name: Integration (SQL)
    runs-on: ubuntu-latest
    needs: lint_and_unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: keeptrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d keeptrack_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/keeptrack_test
      SQLA_NULLPOOL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d keeptrack_test && break
            echo "Postgres not ready yet..."; sleep 2
          done

      - name: Run migrations
        run: make migrate

      - name: Run SQL tests
        run: pytest -q -m sql
